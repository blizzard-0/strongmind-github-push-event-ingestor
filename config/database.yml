default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "strongmind") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "strongmind_development") %>

development:
  <<: *default
  database: <%= ENV.fetch("DB_NAME", "strongmind_github_events_development") %>

test:
  <<: *default
  database: <%= ENV.fetch("TEST_DB_NAME", "strongmind_github_events_test") %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
  database: <%= ENV.fetch("DB_NAME", "strongmind_github_events_production") %>
